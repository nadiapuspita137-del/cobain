<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Music Player • Playlist</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="playlist.css">
</head>
<body>
<main class="app">
<header><div class="logo">MUSIC<span>.</span></div><div class="source">SOURCE · YOUTUBE</div></header>
<section class="search-box"><input id="query" type="search" value="When I Was Your Man Bruno Mars" placeholder="Cari lagu, artis, atau tempel link YouTube..." autocomplete="off"><button id="searchBtn">Cari</button></section>
<section class="player-card"><div class="cover"><img id="cover" src="https://i.ytimg.com/vi/ekzHIouo8Q4/hqdefault.jpg" alt="Cover"></div><div class="details"><small>NOW PLAYING</small><h1 id="title">When I Was Your Man</h1><p id="artist">Bruno Mars</p><div class="actions"><button id="backBtn" class="round">↶</button><button id="playBtn" class="play">▶</button><button id="openBtn" class="round">↗</button></div><div id="status">Siap diputar</div></div></section>
<section class="playlist"><div class="section-head"><div><h2>Playlist kau</h2><span>13 lagu</span></div><button id="openSearch" class="mini-btn">Cari di YouTube ↗</button></div><div id="playlistList" class="playlist-list"></div></section>
<section class="yt-wrap"><div id="youtube-player"></div></section>
</main>
<script>
const DEFAULT_ID='ekzHIouo8Q4';
const songs=[
{title:'Die With A Smile',artist:'Lady Gaga, Bruno Mars',album:'Die With A Smile',time:'4:11',query:'Lady Gaga Bruno Mars Die With A Smile official'},
{title:'505',artist:'Arctic Monkeys',album:'Favourite Worst Nightmare',time:'4:13',query:'Arctic Monkeys 505 official'},
{title:'Those Eyes',artist:'New West',album:'Those Eyes',time:'3:40',id:'b_CpWmkhwq0'},
{title:'End of Beginning',artist:'Djo',album:'DECIDE',time:'2:39',query:'Djo End of Beginning official audio'},
{title:'Atlantis',artist:'Seafret',album:"Tell Me It's Real (Expanded Edition)",time:'3:49',query:'Seafret Atlantis official'},
{title:'I Love You So',artist:'The Walters',album:'I Love You So',time:'2:40',query:'The Walters I Love You So official'},
{title:'The Night We Met',artist:'Lord Huron',album:'Strange Trails',time:'3:28',query:'Lord Huron The Night We Met official'},
{title:'Mind Over Matter (Reprise)',artist:'Young the Giant',album:'Mirrorball / Mind Over Matter (Reprise)',time:'3:50',id:'buvWBOZTfdc'},
{title:'I Wanna Be Yours',artist:'Arctic Monkeys',album:'AM',time:'3:03',query:'Arctic Monkeys I Wanna Be Yours official'},
{title:'It Will Rain',artist:'Bruno Mars',album:'It Will Rain',time:'4:17',query:'Bruno Mars It Will Rain official'},
{title:'When I Was Your Man',artist:'Bruno Mars',album:'Unorthodox Jukebox',time:'3:53',id:DEFAULT_ID},
{title:'Talking to the Moon',artist:'Bruno Mars',album:'Doo-Wops & Hooligans',time:'3:37',query:'Bruno Mars Talking to the Moon official'},
{title:'Creep',artist:'Radiohead',album:'Pablo Honey',time:'3:58',query:'Radiohead Creep official'}
];
let currentId=DEFAULT_ID,player=null,apiReady=false;const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function extractVideoId(v){const m=v.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/))([A-Za-z0-9_-]{11})/);return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(v.trim())?v.trim():null)}
function setStatus(t){$('status').textContent=t}
function setTrack(id,title,artist){currentId=id;$('title').textContent=title;$('artist').textContent=artist;$('cover').src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;if(apiReady){player.loadVideoById(id);setStatus('Memuat lagu...')}else setStatus('Menyiapkan player...');renderPlaylist()}
function playSong(s){if(s.id){setTrack(s.id,s.title,s.artist);return}const q=s.query||`${s.title} ${s.artist}`;window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`,'_blank','noopener');setStatus('Pencarian YouTube dibuka. Tempel URL video untuk memutarnya di sini.')}
function renderPlaylist(){$('playlistList').innerHTML=songs.map((s,i)=>{const active=s.id===currentId;const cover=s.id?`https://i.ytimg.com/vi/${s.id}/mqdefault.jpg`:`https://placehold.co/80x80/171717/d9a86c?text=${encodeURIComponent(String(i+1).padStart(2,'0'))}`;return `<button class="song ${active?'active':''}" data-index="${i}"><span class="num">${i+1}</span><img src="${cover}" alt=""><span class="song-info"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></span><span class="album">${esc(s.album)}</span><span class="time">${s.time}</span><span class="song-play">▶</span></button>`}).join('');document.querySelectorAll('.song').forEach(el=>el.onclick=()=>playSong(songs[Number(el.dataset.index)]))}
function search(){const q=$('query').value.trim();if(!q)return;const id=extractVideoId(q);if(id){setTrack(id,'YouTube Video','YouTube');setStatus('Video dimuat. Tekan Play.');return}window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`,'_blank','noopener');setStatus('Hasil pencarian YouTube dibuka di tab baru.')}
function onYouTubeIframeAPIReady(){player=new YT.Player('youtube-player',{videoId:currentId,playerVars:{playsinline:1,rel:0,controls:1,modestbranding:1},events:{onReady:()=>{apiReady=true;setStatus('Siap diputar')},onStateChange:e=>{if(e.data===1){$('playBtn').textContent='Ⅱ';setStatus('Sedang diputar')}else if(e.data===2){$('playBtn').textContent='▶';setStatus('Dijeda')}else if(e.data===0){$('playBtn').textContent='▶';setStatus('Selesai')}},onError:()=>setStatus('Video tidak bisa diputar di embed. Buka lewat YouTube.')}})}
$('playBtn').onclick=()=>{if(!player){setStatus('Player masih dimuat...');return}if(player.getPlayerState()===1)player.pauseVideo();else player.playVideo()};$('backBtn').onclick=()=>{if(player){player.seekTo(0,true);player.playVideo()}};$('openBtn').onclick=()=>window.open(`https://www.youtube.com/watch?v=${currentId}`,'_blank','noopener');$('searchBtn').onclick=search;$('openSearch').onclick=()=>{const q=$('query').value.trim()||'When I Was Your Man Bruno Mars';window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`,'_blank','noopener')};$('query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
setTrack(DEFAULT_ID,'When I Was Your Man','Bruno Mars');
</script><script src="https://www.youtube.com/iframe_api"></script>
</body></html>
